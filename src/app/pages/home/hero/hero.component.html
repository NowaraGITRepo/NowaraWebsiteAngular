<div class="relative w-full overflow-hidden">
  <!-- GRADIENT BACKGROUND -->
  <div class="absolute inset-0 bg-gradient-to-b from-[#f0f4f8] via-[#cbdcf7] to-[#8da9dc] pointer-events-none"></div>

  <!-- MARQUEE SECTION -->
  <div class="relative w-full z-30 px-4 md:px-20 pt-16">
    <div class="flex w-full overflow-hidden group"
      style="mask-image:linear-gradient(to right,transparent,black 15%,black 85%,transparent);-webkit-mask-image:linear-gradient(to right,transparent,black 15%,black 85%,transparent)">
      <div class="flex gap-10 animate-marquee whitespace-nowrap py-4">
        <div *ngFor="let card of [...cards, ...cards]"
          class="relative bg-white/95 backdrop-blur-md rounded-[2.5rem] p-8 text-center w-[300px] md:w-[350px] flex-shrink-0 border border-white shadow-[0_10px_40px_rgba(255,255,255,0.5)] transition-all duration-500 hover:-translate-y-4 cursor-pointer overflow-hidden">
          <div class="w-14 h-1.5 bg-gradient-to-r from-blue-400 to-indigo-500 mx-auto mb-6 rounded-full"></div>
          <h3 class="font-bold text-xl mb-3 text-[#001529] whitespace-normal leading-tight">{{ card.title }}</h3>
          <p class="text-slate-500 text-sm leading-relaxed whitespace-normal px-2 font-medium">{{ card.desc }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ABOUT US + CHART -->
  <section id="about" class="relative pt-3 pb-8 overflow-hidden">
    <div class="container relative z-10 mx-auto px-4">
      <div class="flex flex-wrap items-center lg:flex-nowrap gap-12 lg:gap-24">

        <!-- Text Side -->
        <div class="w-full lg:w-[50%]">
          <h1 class="text-white text-5xl sm:text-6xl font-black mb-3 drop-shadow-2xl tracking-tighter">About Us</h1>
          <div class="space-y-5 max-w-xl text-white">
            <p class="text-3xl leading-tight font-bold">
              We architect <span class="text-blue-900">Digital Ecosystems</span> for the modern enterprise.
            </p>
            <p class="text-white/90 text-lg leading-relaxed font-medium">
              Expertly deploying <strong>Business Central</strong>, <strong>LS Central</strong>, and <strong>Power BI</strong> to create seamless global operations.
            </p>
          </div>
          <button (click)="openModal()"
            class="mt-12 bg-white text-[#001529] hover:bg-blue-600 hover:text-white px-12 py-5 rounded-2xl font-black shadow-2xl transition-all flex items-center gap-4">
            LET'S CONNECT <span>→</span>
          </button>
        </div>

        <!-- CHART SIDE -->
        <div class="w-full lg:w-[50%] relative min-h-[550px] flex items-center justify-center">

          <!-- Central Node -->
          <div class="relative z-20 w-40 h-40 rounded-full bg-[radial-gradient(circle_at_top,_#0a2540,_#38bdf8)] shadow-[0_20px_60px_rgba(0,80,180,0.55)] flex items-center justify-center text-center p-5">
            <div class="absolute inset-0 rounded-full bg-sky-400/30 blur-2xl -z-10"></div>
            <div class="flex flex-col items-center">
              <p class="text-white font-black text-lg tracking-widest uppercase">Nowara</p>
              <p class="text-white font-bold text-sm tracking-wider">INFOTECH</p>
            </div>
          </div>

          <!-- Ecosystem Nodes -->
          <div class="absolute inset-0">
            <div *ngFor="let node of nodes" class="absolute z-30" [style.top]="node.top" [style.left]="node.left">
              <div class="bg-white/80 backdrop-blur-md border border-white p-4 rounded-2xl shadow-lg flex flex-col items-center w-24 transform -translate-x-1/2 -translate-y-1/2">
                <span class="text-[10px] font-black text-[#001529] uppercase tracking-tighter text-center mt-1">{{ node.label }}</span>
              </div>
            </div>
          </div>

          <!-- Glow -->
          <div class="absolute w-[80%] h-[80%] bg-blue-400/20 blur-[120px] rounded-full pointer-events-none"></div>
        </div>

      </div>
    </div>

    <!-- Bottom Curve -->
    <div class="absolute bottom-0 left-0 w-full opacity-40">
      <img src="/images/footer/ftr-bg.webp" alt="curve" class="w-full h-auto" />
    </div>
  </section>

  <!-- CONTACT DIALOG -->
  <div *ngIf="isOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" (click)="closeModal()"></div>
    <div class="relative bg-white w-full max-w-2xl rounded-[2.5rem] p-10 shadow-2xl animate-fade-in">
      <button (click)="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900 transition-colors z-50">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
      <app-contact-form (success)="closeModal()"></app-contact-form>
    </div>
  </div>
</div>
