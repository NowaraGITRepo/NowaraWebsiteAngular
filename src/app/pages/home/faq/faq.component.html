<section class="relative bg-[#f8fafc] py-24">

  <!-- Blobs in isolated overflow wrapper so pill is never clipped -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute top-0 right-0 h-[500px] w-[500px] rounded-full bg-blue-100/40 blur-[120px]"></div>
    <div class="absolute bottom-0 left-0 h-[400px] w-[400px] rounded-full bg-indigo-100/30 blur-[100px]"></div>
  </div>

  <!-- ── SECTION DIVIDER PILL — sits exactly on the blue/white boundary ── -->
  <div style="position:absolute;top:0;left:50%;transform:translate(-50%,-50%);z-index:30">
    <div style="display:inline-flex;align-items:center;gap:14px;
      background:#ffffff;border:1.5px solid #e2e8f0;border-radius:9999px;
      padding:10px 30px;box-shadow:0 4px 24px rgba(0,0,0,0.08);white-space:nowrap">
      <div style="width:32px;height:1.5px;background:linear-gradient(to right,transparent,#94a3b8);border-radius:2px"></div>
      <span style="font-size:10px;font-weight:900;letter-spacing:0.22em;text-transform:uppercase;color:#64748b">
        Expert Answers
      </span>
      <div style="width:32px;height:1.5px;background:linear-gradient(to left,transparent,#94a3b8);border-radius:2px"></div>
    </div>
  </div>

  <div class="relative z-10 mx-auto max-w-[1380px] px-6 lg:px-20">
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_1.4fr] gap-16 items-start">

      <!-- Left: heading + CTA card -->
      <div class="lg:sticky lg:top-28 space-y-8">
        <div>
          <span class="inline-block mb-4 rounded-full border border-blue-200 bg-blue-50 px-4 py-1.5 text-xs font-bold uppercase tracking-widest text-blue-600">Got Questions?</span>
          <h2 class="text-4xl md:text-5xl font-black text-slate-900 leading-tight tracking-tight mb-5">
            Frequently<br>
            <span class="bg-gradient-to-r from-blue-600 to-cyan-500 bg-clip-text text-transparent">Asked Questions</span>
          </h2>
          <p class="text-slate-400 text-base leading-relaxed max-w-sm">
            Everything you need to know about our ERP and CRM solutions. Can't find what you're looking for?
          </p>
        </div>

        <!-- Contact card -->
        <a routerLink="/contact-us"
          class="group flex items-center gap-5 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
          <div class="flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-600 to-blue-800 shadow-lg shadow-blue-500/25">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
          </div>
          <div class="flex-1">
            <p class="font-bold text-slate-900 text-sm">Still have questions?</p>
            <p class="text-slate-400 text-xs mt-0.5">Contact our support team →</p>
          </div>
          <svg class="text-slate-300 transition-transform duration-200 group-hover:translate-x-1"
            xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7"/>
          </svg>
        </a>

        <!-- Decorative stat -->
        <div class="flex gap-6">
          <div class="flex flex-col">
            <span class="text-3xl font-black text-slate-900">50+</span>
            <span class="text-xs font-bold uppercase tracking-widest text-blue-500 mt-0.5">Global Clients</span>
          </div>
          <div class="w-px bg-slate-200"></div>
          <div class="flex flex-col">
            <span class="text-3xl font-black text-slate-900">10+</span>
            <span class="text-xs font-bold uppercase tracking-widest text-blue-500 mt-0.5">Years Experience</span>
          </div>
          <div class="w-px bg-slate-200"></div>
          <div class="flex flex-col">
            <span class="text-3xl font-black text-slate-900">24/7</span>
            <span class="text-xs font-bold uppercase tracking-widest text-blue-500 mt-0.5">Support</span>
          </div>
        </div>
      </div>

      <!-- Right: Accordion -->
      <div class="space-y-3">
        <div *ngFor="let item of items; let i = index"
          class="group rounded-2xl border transition-all duration-300 overflow-hidden"
          [class.border-blue-200]="activeIndex === i"
          [class.bg-white]="activeIndex === i"
          [class.shadow-lg]="activeIndex === i"
          [class.shadow-blue-500/8]="activeIndex === i"
          [class.border-slate-200]="activeIndex !== i"
          [class.bg-white]="activeIndex !== i">

          <!-- Question -->
          <button (click)="toggle(i)"
            class="flex w-full items-center justify-between gap-4 px-7 py-6 text-left transition-colors duration-200">
            <span class="font-bold text-slate-900 text-sm leading-snug pr-2">{{ item.title }}</span>
            <div class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-xl transition-all duration-300"
              [class.bg-blue-600]="activeIndex === i"
              [class.bg-slate-100]="activeIndex !== i"
              [class.rotate-180]="activeIndex === i">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                [attr.stroke]="activeIndex === i ? 'white' : '#64748b'">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </button>

          <!-- Answer -->
          <div class="overflow-hidden transition-all duration-400"
            [style.max-height]="activeIndex === i ? '400px' : '0'"
            [style.opacity]="activeIndex === i ? '1' : '0'">
            <div class="px-7 pb-6">
              <div class="h-px w-full bg-blue-100 mb-4"></div>
              <p class="text-slate-500 text-sm leading-relaxed">{{ item.content }}</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
