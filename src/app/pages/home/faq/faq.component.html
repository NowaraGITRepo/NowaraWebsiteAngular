<section class="pt-15 pb-20 bg-white">
  <div class="container mx-auto px-4">
    <div class="flex flex-col gap-y-8">
      <h2 class="text-secondary text-center text-3xl md:text-4xl font-bold">Frequently asked questions</h2>

      <div class="overflow-hidden relative z-10 lg:max-w-[770px] w-full m-auto bg-white rounded-2xl shadow-light-shadwo border border-slate-100">

        <div *ngFor="let item of items; let i = index"
          class="border-b border-slate-100 last:border-0"
          [class.accordion__item--active]="activeIndex === i">

          <button (click)="toggle(i)"
            class="flex justify-between items-center w-full text-left cursor-pointer p-8 bg-white text-secondary hover:bg-[#f0f4f8] group transition-colors duration-200">
            <span class="text-base font-bold pr-4">{{ item.title }}</span>
            <span class="rounded-full flex-shrink-0 transition-transform duration-300" [class.rotate-180]="activeIndex === i">
              <svg *ngIf="activeIndex !== i" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 7.99805H8V13.998H6V7.99805H0V5.99805H6V-0.00195312H8V5.99805H14V7.99805Z" fill="#102C46"/>
              </svg>
              <svg *ngIf="activeIndex === i" width="14" height="2" viewBox="0 0 14 2" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 1.99799H0V-0.00201416H14V1.99799Z" fill="#102C46"/>
              </svg>
            </span>
          </button>

          <div class="overflow-hidden transition-all duration-400"
            [style.max-height]="activeIndex === i ? '500px' : '0'"
            [style.opacity]="activeIndex === i ? '1' : '0'">
            <p class="text-slate-600 font-normal text-base px-8 py-4">{{ item.content }}</p>
          </div>
        </div>

        <div class="text-center bg-[#f0f4f8] py-8">
          <p class="text-secondary font-normal text-base text-center pb-2">Still have questions?</p>
          <a routerLink="/contact-us" class="text-primary text-base font-normal hover:text-black transition-colors">
            Contact our support team
          </a>
        </div>

      </div>
    </div>
  </div>
</section>
