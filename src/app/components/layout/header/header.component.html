<header class="hd-header fixed top-0 z-50 flex h-16 w-full items-center" [class.is-scrolled]="sticky">

  <!-- Glass layer lives in its own element: a backdrop-filter on <header> itself would
       trap the fixed mobile drawer inside the 64px bar. -->
  <div class="hd-glass pointer-events-none absolute inset-0" aria-hidden="true"></div>

  <!-- Hero-palette wash (lavender → pink → peach) so the bar blends into the slider; fades once you scroll -->
  <div class="hd-tint pointer-events-none absolute inset-0" aria-hidden="true"></div>

  <!-- Scroll progress hairline -->
  <div class="hd-progress" [style.width.%]="progress" aria-hidden="true"></div>

  <div class="container relative mx-auto flex items-center justify-between px-4 lg:px-8">

    <!-- ── LOGO ── -->
    <a routerLink="/" class="hd-logo flex flex-shrink-0 items-center gap-2.5" aria-label="Nowara Infotech home">
      <img src="/images/logo/cropped-logofooter.webp" alt="Nowara Infotech" style="width:46px;height:auto" />
      <span class="flex select-none flex-col leading-[1.15]">
        <span class="hd-word">NOWARA</span>
        <span class="hd-word hd-word-2">INFOTECH</span>
      </span>
    </a>

    <!-- ── DESKTOP NAV ── -->
    <nav class="hidden lg:block" aria-label="Main">
      <ul class="m-0 flex list-none items-center gap-0.5 p-0 xl:gap-1.5">
        <li *ngFor="let item of headerData; let i = index" class="relative">

          <!-- Has submenu -->
          <ng-container *ngIf="item.submenu; else simpleLink">
            <div class="relative"
              (mouseenter)="openDropdown = i; openSubDropdown = null"
              (mouseleave)="openDropdown = null; openSubDropdown = null">

              <button type="button"
                [attr.aria-label]="item.label + ' menu'"
                [attr.aria-expanded]="openDropdown === i"
                [class.is-active]="isActive(item.href)"
                [class.is-open]="openDropdown === i"
                (click)="navigateIfLink(item.href)"
                class="hd-link">
                {{ item.label }}
                <iconify-icon
                  icon="heroicons:chevron-down"
                  class="ml-1 text-xs opacity-70 transition-transform duration-300"
                  [class.rotate-180]="openDropdown === i">
                </iconify-icon>
              </button>

              <!-- Level-1 dropdown (pt-3 is an invisible hover bridge) -->
              <div *ngIf="openDropdown === i" class="absolute left-0 top-full z-[9999] pt-3">
                <div class="hd-panel hd-pop min-w-[220px] w-max">
                  <div class="p-1.5">

                    <ng-container *ngFor="let sub of item.submenu; let j = index">

                      <!-- Sub-item WITH nested submenu (flyout) -->
                      <ng-container *ngIf="sub.submenu; else plainSubLink">
                        <div class="relative"
                          (mouseenter)="openSubDropdown = sub.label"
                          (mouseleave)="openSubDropdown = null">

                          <div class="hd-item select-none" [class.is-hover]="openSubDropdown === sub.label"
                            (click)="navigateIfLink(sub.href)">
                            <span class="flex items-center gap-3">
                              <span class="hd-ico">
                                <span *ngIf="sub.customIcon" [innerHTML]="sub.customIcon | safeHtml"></span>
                                <iconify-icon *ngIf="!sub.customIcon && sub.icon" [attr.icon]="sub.icon" width="18" height="18"
                                  [class]="sub.iconColor || 'text-[#114f9a]'"></iconify-icon>
                                <span *ngIf="!sub.customIcon && !sub.icon" class="hd-dot"></span>
                              </span>
                              <span class="whitespace-nowrap">{{ sub.label }}</span>
                            </span>
                            <iconify-icon icon="heroicons:chevron-right" class="hd-arrow flex-shrink-0 text-xs"></iconify-icon>
                          </div>

                          <!-- Level-2 flyout (right side) -->
                          <div *ngIf="openSubDropdown === sub.label" class="absolute left-full top-[-7px] z-[10000] pl-2">
                            <div class="hd-panel hd-pop min-w-[200px] w-max">
                              <div class="p-1.5">
                                <a *ngFor="let child of sub.submenu"
                                  [routerLink]="child.href"
                                  (click)="closeAllDropdowns()"
                                  class="hd-item">
                                  <span class="flex items-center gap-3">
                                    <span class="hd-ico">
                                      <span *ngIf="child.customIcon" [innerHTML]="child.customIcon | safeHtml"></span>
                                      <iconify-icon *ngIf="!child.customIcon && child.icon" [attr.icon]="child.icon" width="18" height="18"
                                        [class]="child.iconColor || 'text-[#114f9a]'"></iconify-icon>
                                      <span *ngIf="!child.customIcon && !child.icon" class="hd-dot"></span>
                                    </span>
                                    <span class="whitespace-nowrap">{{ child.label }}</span>
                                  </span>
                                </a>
                              </div>
                            </div>
                          </div>

                        </div>
                      </ng-container>

                      <!-- Plain sub-link -->
                      <ng-template #plainSubLink>
                        <a [routerLink]="sub.href" (click)="closeAllDropdowns()" class="hd-item">
                          <span class="flex items-center gap-3">
                            <span class="hd-ico">
                              <span *ngIf="sub.customIcon" [innerHTML]="sub.customIcon | safeHtml"></span>
                              <iconify-icon *ngIf="!sub.customIcon && sub.icon" [attr.icon]="sub.icon" width="18" height="18"
                                [class]="sub.iconColor || 'text-[#114f9a]'"></iconify-icon>
                              <span *ngIf="!sub.customIcon && !sub.icon" class="hd-dot"></span>
                            </span>
                            <span class="whitespace-nowrap">{{ sub.label }}</span>
                          </span>
                        </a>
                      </ng-template>

                    </ng-container>
                  </div>
                </div>
              </div>

            </div>
          </ng-container>

          <!-- Simple link (no dropdown) -->
          <ng-template #simpleLink>
            <a [routerLink]="item.href" [class.is-active]="router.url === item.href" class="hd-link">
              {{ item.label }}
            </a>
          </ng-template>

        </li>
      </ul>
    </nav>

    <!-- ── RIGHT: CTA + hamburger ── -->
    <div class="flex items-center gap-3">
      <a routerLink="/contact-us" class="hd-cta hidden lg:inline-flex">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2zm7 11l.9 2.6 2.6.9-2.6.9L19 20l-.9-2.6-2.6-.9 2.6-.9L19 13z"/>
        </svg>
        Get in Touch
      </a>

      <!-- Hamburger -->
      <button type="button" (click)="toggleNav()" class="hd-burger hd-burger-mobile lg:hidden" aria-label="Toggle menu" [attr.aria-expanded]="navbarOpen">
        <span class="block h-0.5 w-5 rounded bg-[#14233d] transition-all duration-300"
          [class.rotate-45]="navbarOpen" [class.translate-y-2]="navbarOpen"></span>
        <span class="block h-0.5 w-5 rounded bg-[#14233d] transition-all duration-300"
          [class.opacity-0]="navbarOpen"></span>
        <span class="block h-0.5 w-5 rounded bg-[#14233d] transition-all duration-300"
          [class.-rotate-45]="navbarOpen" [class.-translate-y-2]="navbarOpen"></span>
      </button>
    </div>
  </div>

  <!-- ── MOBILE SIDEBAR ── -->
  <div
    class="hd-drawer fixed right-0 top-0 z-[60] flex h-full w-[320px] max-w-[88vw] transform flex-col transition-transform duration-300 lg:hidden"
    [class.translate-x-0]="navbarOpen"
    [class.translate-x-full]="!navbarOpen"
    [attr.aria-hidden]="!navbarOpen"
    [attr.inert]="!navbarOpen ? '' : null">

    <!-- Header -->
    <div class="hd-drawer-head flex flex-shrink-0 items-center justify-between px-5 py-4">
      <div class="flex items-center gap-2.5">
        <img src="/images/logo/cropped-logofooter.webp" alt="Nowara Infotech" style="height:38px;width:auto" />
        <span class="flex flex-col leading-[1.15]">
          <span class="hd-word" style="font-size:13px">NOWARA</span>
          <span class="hd-word hd-word-2" style="font-size:10px">INFOTECH</span>
        </span>
      </div>
      <button type="button" (click)="closeNav()" aria-label="Close menu" class="hd-burger">
        <iconify-icon icon="ic:round-close" style="font-size:22px"></iconify-icon>
      </button>
    </div>

    <!-- Nav links (scrollable) -->
    <nav class="flex-1 overflow-y-auto py-2" aria-label="Mobile">

      <div *ngFor="let item of headerData; let i = index">

        <!-- Has submenu -->
        <ng-container *ngIf="item.submenu; else mobileSingleLink">
          <button type="button"
            (click)="toggleMobileDropdown(i)"
            [attr.aria-expanded]="openMobileDropdown === i"
            [class.is-open]="openMobileDropdown === i"
            class="hd-m-row w-full">
            <span>{{ item.label }}</span>
            <iconify-icon icon="heroicons:chevron-down" class="text-sm transition-transform duration-300"
              [class.rotate-180]="openMobileDropdown === i"></iconify-icon>
          </button>

          <div *ngIf="openMobileDropdown === i" class="hd-m-open hd-m-group">
            <ng-container *ngFor="let sub of item.submenu; let j = index">

              <!-- Sub has nested submenu -->
              <ng-container *ngIf="sub.submenu; else mobilePlainSub">
                <button type="button"
                  (click)="toggleMobileSubDropdown(i + '-' + j)"
                  [attr.aria-expanded]="openMobileSubDropdown === (i + '-' + j)"
                  class="hd-m-sub w-full justify-between">
                  <span class="flex items-center gap-2.5">
                    <iconify-icon *ngIf="sub.icon" [attr.icon]="sub.icon" width="16" height="16"
                      [class]="sub.iconColor || 'text-slate-400'"></iconify-icon>
                    {{ sub.label }}
                  </span>
                  <iconify-icon icon="heroicons:chevron-down" class="text-xs transition-transform duration-300"
                    [class.rotate-180]="openMobileSubDropdown === (i + '-' + j)"></iconify-icon>
                </button>

                <div *ngIf="openMobileSubDropdown === (i + '-' + j)" class="hd-m-open hd-m-nest">
                  <a *ngFor="let child of sub.submenu"
                    [routerLink]="child.href"
                    (click)="closeNav()"
                    class="hd-m-child">
                    <iconify-icon *ngIf="child.icon" [attr.icon]="child.icon" width="15" height="15"
                      [class]="child.iconColor || 'text-slate-400'"></iconify-icon>
                    {{ child.label }}
                  </a>
                </div>
              </ng-container>

              <!-- Plain sub-link -->
              <ng-template #mobilePlainSub>
                <a [routerLink]="sub.href" (click)="closeNav()" class="hd-m-sub">
                  <iconify-icon *ngIf="sub.icon" [attr.icon]="sub.icon" width="16" height="16"
                    [class]="sub.iconColor || 'text-slate-400'"></iconify-icon>
                  {{ sub.label }}
                </a>
              </ng-template>

            </ng-container>
          </div>
        </ng-container>

        <!-- Simple link -->
        <ng-template #mobileSingleLink>
          <a [routerLink]="item.href" (click)="closeNav()" class="hd-m-row">
            {{ item.label }}
          </a>
        </ng-template>

      </div>
    </nav>

    <!-- Footer CTA -->
    <div class="hd-drawer-foot flex-shrink-0 p-5">
      <a routerLink="/contact-us" (click)="closeNav()" class="hd-cta flex w-full justify-center" style="padding:13px 18px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2zm7 11l.9 2.6 2.6.9-2.6.9L19 20l-.9-2.6-2.6-.9 2.6-.9L19 13z"/>
        </svg>
        Get in Touch
      </a>
    </div>
  </div>

  <!-- Overlay -->
  <div *ngIf="navbarOpen" class="hd-overlay fixed inset-0 z-[55] lg:hidden" (click)="closeNav()"></div>

</header>
