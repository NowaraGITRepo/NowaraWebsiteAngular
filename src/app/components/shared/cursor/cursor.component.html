<!-- Full-screen particle canvas -->
<canvas #canvas
  style="position:fixed;top:0;left:0;width:100vw;height:100vh;
         pointer-events:none;z-index:99998;"></canvas>

<!-- Cursor element — GPU-transformed each frame -->
<div #cursorEl
  style="position:fixed;top:0;left:0;pointer-events:none;z-index:99999;
         will-change:transform;transition:transform 0.18s cubic-bezier(0.23,1,0.32,1);">

  <!-- Outer pulse ring -->
  <div style="position:absolute;top:50%;left:50%;
    width:26px;height:26px;border-radius:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(0,200,200,0.45);
    animation:cursorRing1 2.2s ease-in-out infinite;"></div>

  <!-- Inner pulse ring -->
  <div style="position:absolute;top:50%;left:50%;
    width:20px;height:20px;border-radius:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(20,180,180,0.3);
    animation:cursorRing2 2.2s ease-in-out infinite 0.55s;"></div>

  <!-- ── Business Central Logo — 16 × 16 px ─────────────────────── -->
  <svg width="16" height="16" viewBox="0 0 22 22"
    xmlns="http://www.w3.org/2000/svg"
    style="display:block;
           filter:drop-shadow(0 0 5px #00c8c8bb)
                  drop-shadow(0 0 12px #0a9a9a55);">
    <defs>
      <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
        <stop offset="0%"   stop-color="#1a8585"/>
        <stop offset="100%" stop-color="#0a5e5e"/>
      </radialGradient>
      <radialGradient id="hubGrad" cx="40%" cy="35%" r="60%">
        <stop offset="0%"   stop-color="#22c4c4"/>
        <stop offset="100%" stop-color="#0f9e9e"/>
      </radialGradient>
      <filter id="sf" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="0.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- 1. Dark teal outer circle (background) -->
    <circle cx="11" cy="11" r="11" fill="url(#bgGrad)"/>

    <!-- 2. Arms (behind hub so hub overlaps cleanly) -->
    <!-- Top arm -->
    <rect x="10.1" y="3.8" width="1.8" height="3.2" rx="0.9" fill="#7de8e4"/>
    <!-- Bottom arm -->
    <rect x="10.1" y="15.0" width="1.8" height="3.2" rx="0.9" fill="#7de8e4"/>
    <!-- Left arm -->
    <rect x="3.8" y="10.1" width="3.2" height="1.8" rx="0.9" fill="#7de8e4"/>
    <!-- Right arm -->
    <rect x="15.0" y="10.1" width="3.2" height="1.8" rx="0.9" fill="#7de8e4"/>

    <!-- 3. Satellite nodes at cardinal points -->
    <circle cx="11" cy="2.8" r="2.4" fill="#7de8e4"/>   <!-- top    -->
    <circle cx="11" cy="19.2" r="2.4" fill="#7de8e4"/>  <!-- bottom -->
    <circle cx="2.8" cy="11" r="2.4" fill="#7de8e4"/>   <!-- left   -->
    <circle cx="19.2" cy="11" r="2.4" fill="#7de8e4"/>  <!-- right  -->

    <!-- 4. Hub circle (medium teal) -->
    <circle cx="11" cy="11" r="5.2" fill="url(#hubGrad)"/>

    <!-- 5. Hub inner lighter ring -->
    <circle cx="11" cy="11" r="4.0" fill="#3dd4d4" opacity="0.55"/>

    <!-- 6. "C" crescent in very centre (opening faces right) -->
    <!-- Light teal filled circle then dark arc cut out = C shape -->
    <circle cx="11" cy="11" r="2.8" fill="#96eeed"/>
    <path d="M12.5 8.4 A3.0 3.0 0 1 0 12.5 13.6"
          fill="none"
          stroke="#0f9e9e"
          stroke-width="1.4"
          stroke-linecap="round"/>

    <!-- 7. Subtle gloss on top-left -->
    <ellipse cx="9" cy="8" rx="3" ry="1.6"
             fill="white" opacity="0.09"
             transform="rotate(-30 9 8)"/>
  </svg>

</div>
