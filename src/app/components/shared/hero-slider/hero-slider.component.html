<section id="swipe" class="w-full overflow-hidden relative bg-black h-[420px] md:h-[540px] lg:h-[620px]">

  <div class="swiper nowara-hero-swiper h-full w-full">
    <div class="swiper-wrapper">

      <div *ngFor="let slide of slides; let i = index" class="swiper-slide relative overflow-hidden">

        <!-- BG Image with parallax depth only -->
        <div class="absolute inset-0" data-swiper-parallax="25%">
          <img [src]="slide.src" [alt]="slide.tag"
            class="w-full h-full object-cover scale-110"
            [attr.loading]="i === 0 ? 'eager' : 'lazy'"
            [attr.fetchpriority]="i === 0 ? 'high' : 'auto'"
            decoding="async" width="1920" height="620" />
          <div class="absolute inset-0 bg-black/45"></div>
        </div>

        <!-- Content -->
        <div class="absolute inset-0 z-20 flex flex-col justify-center px-6 md:px-20 lg:px-32"
          [class.items-end]="slide['align'] === 'right'"
          [class.items-start]="slide['align'] !== 'right'">

          <div [class.max-w-2xl]="slide['align'] === 'right'"
               [class.text-right]="slide['align'] === 'right'"
               [class.items-end]="slide['align'] === 'right'"
               [class.max-w-4xl]="slide['align'] !== 'right'"
               [class.text-left]="slide['align'] !== 'right'"
               class="flex flex-col">

            <!-- Tag badge -->
            <div class="hero-tag inline-flex items-center gap-2 bg-white/10 border border-white/20 px-4 py-2 rounded-full mt-10 backdrop-blur-md self-start"
              [class.self-end]="slide['align'] === 'right'">
              <span class="w-2 h-2 bg-blue-400 rounded-full animate-pulse"></span>
              <span class="text-white text-[10px] md:text-xs font-bold tracking-[0.2em] uppercase">{{ slide.tag }}</span>
            </div>

            <!-- Title (h2 — page h1 is the main hero headline below) -->
            <h2 class="hero-title text-4xl md:text-6xl lg:text-7xl font-bold text-white leading-tight mb-6"
              [innerHTML]="slide.title"></h2>

            <!-- Description -->
            <p class="hero-desc text-gray-100 text-lg md:text-xl leading-relaxed mb-10 max-w-xl opacity-90">
              {{ slide.desc }}
            </p>

            <!-- Button -->
            <div class="hero-btn">
              <button (click)="openModal(slide.brochure, slide.tag)" aria-label="Book a Free Demo"
                class="relative overflow-hidden bg-[#3D77BE] hover:bg-white text-white hover:text-[#3D77BE] font-bold py-4 px-10 rounded-lg transition-all duration-300 shadow-xl active:scale-95">
                Book a Free Demo
              </button>
            </div>

          </div>
        </div>
      </div>

    </div>
    <div class="swiper-pagination"></div>
  </div>
  <!--Summit page -->
<!-- EVENT POPUP -->
<div *ngIf="showEventPopup" style="
  position:absolute;
  top:95px;
  right:90px;
  z-index:40;
  width:300px;
  max-width:calc(100% - 40px);
  background:linear-gradient(145deg,#071633,#0b2a66);
  color:#fff;
  border:1px solid #2563eb;
  border-radius:16px;
  padding:16px;
  box-shadow:0 20px 45px rgba(37,99,235,.35);
">

  <button type="button" (click)="closeEventPopup()" style="
    position:absolute;
    top:8px;
    right:12px;
    background:transparent;
    border:none;
    color:#fff;
    font-size:22px;
    line-height:1;
    cursor:pointer;
  ">
    ×
  </button>

  <div style="width:34px;height:34px;background:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:16px;">
    📅
  </div>

  <div style="font-size:10px;font-weight:800;color:#facc15;letter-spacing:1px;margin-bottom:7px;">
    UPCOMING EVENT
  </div>

  <h3 style="font-size:20px;font-weight:900;line-height:1.25;margin:0 0 12px;padding-right:18px;">
   Nowara CXO Roundtable Conference 2026
  </h3>

  <div style="height:1px;background:rgba(255,255,255,.18);margin:12px 0;"></div>

  <p style="font-size:12px;margin:0 0 7px;color:#e5e7eb;">
    📅 Friday, 7 August 2026
  </p>

  <p style="font-size:12px;margin:0 0 10px;color:#e5e7eb;line-height:1.4;">
    📍 Hotel Lemon Tree Banjara Hills,<br>
    Hyderabad, India
  </p>

  <a routerLink="/CXO-Roundtable-Conference-2026" style="
    display:block;
    text-align:center;
    background:#fff;
    color:#0b1530;
    padding:10px;
    border-radius:9px;
    font-size:13px;
    font-weight:800;
    text-decoration:none;
    margin-top:12px;
  ">
    View Details →
  </a>

</div>
  <!-- MODAL -->
  <div *ngIf="isModalOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-6">
    <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md" (click)="closeModal()"></div>

    <div class="relative w-full max-w-2xl z-10 animate-fade-in">
      <div class="bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-white/20">

        <div class="bg-slate-50 px-4 py-4 md:px-8 md:py-6 border-b border-slate-100 flex justify-between items-center">
          <div>
            <h3 class="text-xl font-bold text-slate-800">Request Brochure</h3>
            <p class="text-sm text-slate-500">Fill in your details to receive the {{ activeTag }} guide.</p>
          </div>
          <button (click)="closeModal()" aria-label="Close modal"
            class="p-2 hover:bg-slate-200 rounded-full text-slate-400 hover:text-slate-600 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <div class="p-4 md:p-8 lg:p-10 bg-white">
          <app-contact-form [isModal]="true" (success)="closeModal()"></app-contact-form>
        </div>
      </div>
    </div>
  </div>

</section>
