<!-- ENQUIRY MODAL -->
<div *ngIf="openEnquiry" class="fixed inset-0 z-[9998] bg-slate-900/60 backdrop-blur-sm" (click)="closeAll()"></div>
<div *ngIf="openEnquiry"
  class="fixed bottom-24 right-4 md:right-10 w-[calc(100%-2rem)] max-w-[400px] bg-white z-[9999] shadow-2xl rounded-[2.5rem] overflow-hidden border border-slate-200">

  <!-- Success state -->
  <div *ngIf="isSuccess" class="p-12 text-center flex flex-col items-center justify-center min-h-[300px]">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
      <iconify-icon icon="solar:check-circle-bold" style="font-size:48px" class="text-green-500"></iconify-icon>
    </div>
    <h2 class="text-2xl font-black text-slate-900">Request Sent!</h2>
    <p class="text-slate-500 mt-2">Check your downloads for the brochure.</p>
  </div>

  <!-- Form state -->
  <div *ngIf="!isSuccess">
    <div class="bg-[#0955a0] p-6 text-white relative">
      <button (click)="closeAll()" class="absolute top-6 right-6 hover:rotate-90 transition-transform">
        <iconify-icon icon="ic:round-close" style="font-size:22px"></iconify-icon>
      </button>
      <div class="flex items-center gap-3">
        <div class="p-2 bg-white/20 rounded-xl">
          <iconify-icon icon="solar:letter-bold" style="font-size:20px"></iconify-icon>
        </div>
        <h2 class="text-xl font-bold">Expert Consultation</h2>
      </div>
    </div>

    <form (ngSubmit)="submitEnquiry()" class="p-6 space-y-4">
      <!-- Name -->
      <div>
        <label class="flex items-center gap-2 text-[10px] uppercase font-bold text-slate-400 mb-1.5 ml-1">
          <iconify-icon icon="solar:user-bold" style="font-size:14px"></iconify-icon> Full Name
        </label>
        <input [(ngModel)]="form.name" name="name" placeholder="John Doe"
          class="w-full bg-slate-50 border-2 rounded-2xl px-5 py-3 outline-none text-sm font-medium transition-all"
          [class.border-red-400]="errors.name" [class.border-slate-100]="!errors.name" />
        <p *ngIf="errors.name" class="text-[10px] text-red-500 mt-1 ml-2 font-bold">{{ errors.name }}</p>
      </div>
      <!-- Mobile -->
      <div>
        <label class="flex items-center gap-2 text-[10px] uppercase font-bold text-slate-400 mb-1.5 ml-1">
          <iconify-icon icon="solar:smartphone-2-bold" style="font-size:14px"></iconify-icon> Mobile Number
        </label>
        <input [(ngModel)]="form.mobile" name="mobile" placeholder="10-digit mobile" maxlength="10"
          class="w-full bg-slate-50 border-2 rounded-2xl px-5 py-3 outline-none text-sm font-medium transition-all"
          [class.border-red-400]="errors.mobile" [class.border-slate-100]="!errors.mobile" />
        <p *ngIf="errors.mobile" class="text-[10px] text-red-500 mt-1 ml-2 font-bold">{{ errors.mobile }}</p>
      </div>
      <!-- Pincode -->
      <div>
        <label class="flex items-center gap-2 text-[10px] uppercase font-bold text-slate-400 mb-1.5 ml-1">
          <iconify-icon icon="solar:map-point-bold" style="font-size:14px"></iconify-icon> Area Pincode
        </label>
        <input [(ngModel)]="form.pincode" name="pincode" placeholder="6-digit code" maxlength="6"
          class="w-full bg-slate-50 border-2 rounded-2xl px-5 py-3 outline-none text-sm font-medium transition-all"
          [class.border-red-400]="errors.pincode" [class.border-slate-100]="!errors.pincode" />
        <p *ngIf="errors.pincode" class="text-[10px] text-red-500 mt-1 ml-2 font-bold">{{ errors.pincode }}</p>
      </div>

      <button type="submit" [disabled]="isSubmitting"
        class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition-all flex items-center justify-center gap-3 mt-2 shadow-lg shadow-slate-200">
        <iconify-icon *ngIf="isSubmitting" icon="svg-spinners:ring-resize" style="font-size:20px"></iconify-icon>
        <span>{{ isSubmitting ? 'Submitting...' : 'Get Quote & Brochure' }}</span>
      </button>
    </form>
  </div>
</div>

<!-- AI CHAT WINDOW -->
<div *ngIf="openChat"
  class="fixed bottom-20 right-4 md:right-24 w-[340px] bg-white z-[9999] shadow-2xl rounded-[2.5rem] flex flex-col overflow-hidden border border-slate-200"
  style="height:450px">

  <!-- Chat header -->
  <div class="bg-slate-900 p-5 text-white flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-500/20 rounded-full flex items-center justify-center border border-blue-500/30">
        <iconify-icon icon="solar:robot-bold" style="font-size:18px" class="text-blue-400"></iconify-icon>
      </div>
      <span class="font-bold tracking-tight">Nowara AI</span>
    </div>
    <button (click)="closeAll()" class="hover:bg-white/10 p-1 rounded-lg transition-colors">
      <iconify-icon icon="ic:round-close" style="font-size:20px"></iconify-icon>
    </button>
  </div>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50">
    <div *ngFor="let m of messages" class="flex" [class.justify-end]="m.role==='user'" [class.justify-start]="m.role==='ai'">
      <div class="max-w-[85%] p-3.5 rounded-2xl text-[13px] shadow-sm leading-relaxed"
        [class.bg-blue-600]="m.role==='user'" [class.text-white]="m.role==='user'" [class.rounded-tr-none]="m.role==='user'"
        [class.bg-white]="m.role==='ai'" [class.text-slate-800]="m.role==='ai'" [class.border]="m.role==='ai'" [class.border-slate-200]="m.role==='ai'" [class.rounded-tl-none]="m.role==='ai'"
        [innerHTML]="m.text">
      </div>
    </div>
    <!-- Typing indicator -->
    <div *ngIf="isAiTyping" class="flex justify-start">
      <div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none shadow-sm">
        <div class="flex gap-1.5">
          <span class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce"></span>
          <span class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay:0.2s"></span>
          <span class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay:0.4s"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick chips -->
  <div *ngIf="!isAiTyping" class="bg-white px-4 py-3 border-t border-slate-100">
    <div class="grid grid-cols-2 gap-2">
      <button (click)="sendChat('services')"
        class="bg-blue-50 border border-blue-100 text-blue-700 px-3 py-2 rounded-xl text-[11px] font-bold hover:bg-blue-600 hover:text-white transition">
        Our Services 🛠️
      </button>
      <button (click)="sendChat('expertise')"
        class="bg-blue-50 border border-blue-100 text-blue-700 px-3 py-2 rounded-xl text-[11px] font-bold hover:bg-blue-600 hover:text-white transition">
        Our Expertise 🚀
      </button>
      <button (click)="sendChat('contact')"
        class="bg-blue-50 border border-blue-100 text-blue-700 px-3 py-2 rounded-xl text-[11px] font-bold hover:bg-blue-600 hover:text-white transition">
        Contact Us 📞
      </button>
      <button (click)="sendChat('quote')"
        class="bg-blue-50 border border-blue-100 text-blue-700 px-3 py-2 rounded-xl text-[11px] font-bold hover:bg-blue-600 hover:text-white transition">
        Book Quote 📩
      </button>
    </div>
  </div>
</div>

<!-- FLOATING ACTION BUTTONS -->
<div class="fixed z-[9997] bottom-6 right-6 md:right-8 flex flex-col gap-4 items-center">

  <!-- Scroll to top (visible only when scrolled) -->
  <button *ngIf="scrollVisible" (click)="scrollTop()"
    class="w-12 h-12 bg-white shadow-xl rounded-2xl flex items-center justify-center cursor-pointer text-blue-600 border border-slate-100 hover:-translate-y-1 transition-transform">
    <iconify-icon icon="heroicons:chevron-up-20-solid" style="font-size:28px"></iconify-icon>
  </button>

  <!-- Icon group (WhatsApp / Phone / Email) -->
  <div class="flex flex-col gap-3 p-2 backdrop-blur-xl rounded-[2rem] shadow-2xl bg-white/30 border border-white/50">
    <!-- WhatsApp -->
    <button (click)="openWhatsApp()"
      class="w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-lg hover:scale-110 hover:-translate-x-1 transition-transform"
      style="background-color:#25D366">
      <iconify-icon icon="logos:whatsapp-icon" style="font-size:24px"></iconify-icon>
    </button>
    <!-- Phone -->
    <button (click)="openPhone()"
      class="w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-lg hover:scale-110 hover:-translate-x-1 transition-transform"
      style="background-color:#4C5CCF">
      <iconify-icon icon="solar:phone-calling-bold" style="font-size:20px"></iconify-icon>
    </button>
    <!-- Enquiry / Email -->
    <button (click)="toggleEnquiry()"
      class="w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-lg hover:scale-110 hover:-translate-x-1 transition-transform"
      style="background-color:#0955a0">
      <iconify-icon icon="solar:letter-bold" style="font-size:20px"></iconify-icon>
    </button>
  </div>

  <!-- AI Chat bot -->
  <button (click)="toggleChat()"
    class="w-14 h-14 bg-slate-900 shadow-2xl rounded-2xl flex items-center justify-center cursor-pointer relative hover:scale-105 transition-transform">
    <!-- Ping dot when chat is closed -->
    <span *ngIf="!openChat" class="absolute -top-1 -right-1 w-4 h-4 bg-blue-500 rounded-full animate-ping border-2 border-white"></span>
    <iconify-icon icon="solar:robot-bold" style="font-size:28px" class="text-white"></iconify-icon>
  </button>
</div>
