<!-- ENQUIRY MODAL BACKDROP -->
<div *ngIf="openEnquiry" class="fixed inset-0 z-[9998] bg-slate-900/60 backdrop-blur-sm" (click)="closeAll()"></div>

<!-- ENQUIRY MODAL -->
<div *ngIf="openEnquiry"
  class="fixed bottom-24 right-4 md:right-10 w-[calc(100%-2rem)] max-w-[400px] bg-white z-[9999] shadow-2xl rounded-[2.5rem] overflow-hidden border border-slate-200">

  <!-- Success state -->
  <div *ngIf="isSuccess" class="p-12 text-center flex flex-col items-center justify-center min-h-[300px]">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#22c55e" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h2 class="text-2xl font-black text-slate-900">Request Sent!</h2>
    <p class="text-slate-500 mt-2">Check your downloads for the brochure.</p>
  </div>

  <!-- Form state -->
  <div *ngIf="!isSuccess">
    <div class="bg-[#0955a0] p-6 text-white relative">
      <button (click)="closeAll()" aria-label="Close enquiry form" class="absolute top-6 right-6 hover:rotate-90 transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
      <div class="flex items-center gap-3">
        <div class="p-2 bg-white/20 rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h2 class="text-xl font-bold">Expert Consultation</h2>
      </div>
    </div>

    <form (ngSubmit)="submitEnquiry()" class="p-6 space-y-4">
      <div>
        <label class="block text-[10px] uppercase font-bold text-slate-600 mb-1.5 ml-1">Full Name</label>
        <input [(ngModel)]="form.name" name="name" placeholder="John Doe"
          class="w-full bg-slate-50 border-2 rounded-2xl px-5 py-3 outline-none text-sm font-medium transition-all"
          [class.border-red-400]="errors.name" [class.border-slate-100]="!errors.name" />
        <p *ngIf="errors.name" class="text-[10px] text-red-500 mt-1 ml-2 font-bold">{{ errors.name }}</p>
      </div>
      <div>
        <label class="block text-[10px] uppercase font-bold text-slate-600 mb-1.5 ml-1">Mobile Number</label>
        <input [(ngModel)]="form.mobile" name="mobile" placeholder="10-digit mobile" maxlength="10"
          class="w-full bg-slate-50 border-2 rounded-2xl px-5 py-3 outline-none text-sm font-medium transition-all"
          [class.border-red-400]="errors.mobile" [class.border-slate-100]="!errors.mobile" />
        <p *ngIf="errors.mobile" class="text-[10px] text-red-500 mt-1 ml-2 font-bold">{{ errors.mobile }}</p>
      </div>
      <div>
        <label class="block text-[10px] uppercase font-bold text-slate-600 mb-1.5 ml-1">Area Pincode</label>
        <input [(ngModel)]="form.pincode" name="pincode" placeholder="6-digit code" maxlength="6"
          class="w-full bg-slate-50 border-2 rounded-2xl px-5 py-3 outline-none text-sm font-medium transition-all"
          [class.border-red-400]="errors.pincode" [class.border-slate-100]="!errors.pincode" />
        <p *ngIf="errors.pincode" class="text-[10px] text-red-500 mt-1 ml-2 font-bold">{{ errors.pincode }}</p>
      </div>
      <button type="submit" [disabled]="isSubmitting"
        class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition-all flex items-center justify-center gap-3 mt-2">
        <span>{{ isSubmitting ? 'Submitting...' : 'Get Quote & Brochure' }}</span>
      </button>
    </form>
  </div>
</div>

<!-- AI CHAT WINDOW -->
<div *ngIf="openChat"
  class="fixed bottom-24 right-4 md:right-8 w-[calc(100%-2rem)] max-w-[340px] bg-white z-[9999] shadow-2xl rounded-[2rem] flex flex-col overflow-hidden border border-slate-200"
  style="height:450px">

  <!-- Header -->
  <div class="bg-slate-900 px-5 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0">
        <!-- Robot SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1.8">
          <rect x="3" y="8" width="18" height="12" rx="3" stroke="white" stroke-width="1.8" fill="none"/>
          <circle cx="9" cy="14" r="1.5" fill="white"/>
          <circle cx="15" cy="14" r="1.5" fill="white"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4M9 8V6M15 8V6"/>
          <path stroke-linecap="round" d="M9 18h6"/>
        </svg>
      </div>
      <div>
        <p class="text-white font-bold text-sm leading-none">Nowara AI</p>
        <p class="text-green-400 text-[10px] font-medium mt-0.5">● Online</p>
      </div>
    </div>
    <button (click)="closeAll()" class="text-white/60 hover:text-white transition-colors p-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
    <div *ngFor="let m of messages" class="flex" [class.justify-end]="m.role==='user'" [class.justify-start]="m.role==='ai'">
      <div class="max-w-[85%] px-4 py-3 rounded-2xl text-[13px] leading-relaxed shadow-sm"
        [style.background]="m.role==='user' ? '#2563eb' : '#ffffff'"
        [style.color]="m.role==='user' ? '#ffffff' : '#1e293b'"
        [style.border]="m.role==='ai' ? '1px solid #e2e8f0' : 'none'"
        [innerHTML]="m.text">
      </div>
    </div>
    <!-- Typing dots -->
    <div *ngIf="isAiTyping" class="flex justify-start">
      <div class="bg-white border border-slate-200 px-4 py-3 rounded-2xl shadow-sm flex gap-1.5 items-center">
        <span style="width:7px;height:7px;border-radius:50%;background:#3b82f6;display:inline-block;animation:bounce 1s infinite 0s"></span>
        <span style="width:7px;height:7px;border-radius:50%;background:#3b82f6;display:inline-block;animation:bounce 1s infinite 0.2s"></span>
        <span style="width:7px;height:7px;border-radius:50%;background:#3b82f6;display:inline-block;animation:bounce 1s infinite 0.4s"></span>
      </div>
    </div>
  </div>

  <!-- Quick chips -->
  <div class="bg-white px-4 py-3 border-t border-slate-100">
    <div class="grid grid-cols-2 gap-2">
      <button (click)="sendChat('services')" [disabled]="isAiTyping"
        class="bg-blue-50 border border-blue-100 text-blue-700 px-3 py-2 rounded-xl text-[11px] font-bold hover:bg-blue-600 hover:text-white transition disabled:opacity-50">
        Our Services 🛠️
      </button>
      <button (click)="sendChat('expertise')" [disabled]="isAiTyping"
        class="bg-blue-50 border border-blue-100 text-blue-700 px-3 py-2 rounded-xl text-[11px] font-bold hover:bg-blue-600 hover:text-white transition disabled:opacity-50">
        Our Expertise 🚀
      </button>
      <button (click)="sendChat('contact')" [disabled]="isAiTyping"
        class="bg-blue-50 border border-blue-100 text-blue-700 px-3 py-2 rounded-xl text-[11px] font-bold hover:bg-blue-600 hover:text-white transition disabled:opacity-50">
        Contact Us 📞
      </button>
      <button (click)="sendChat('quote')" [disabled]="isAiTyping"
        class="bg-blue-50 border border-blue-100 text-blue-700 px-3 py-2 rounded-xl text-[11px] font-bold hover:bg-blue-600 hover:text-white transition disabled:opacity-50">
        Book Quote 📩
      </button>
    </div>
  </div>
</div>

<!-- FLOATING BUTTONS -->
<div class="fixed z-[9997] bottom-4 right-3 md:bottom-6 md:right-6 flex flex-col gap-2 md:gap-3 items-center">

  <!-- Scroll to top -->
  <button *ngIf="scrollVisible" (click)="scrollTop()" aria-label="Scroll to top"
    class="w-9 h-9 md:w-11 md:h-11 bg-white shadow-xl rounded-xl md:rounded-2xl flex items-center justify-center text-blue-600 border border-slate-100 hover:-translate-y-1 transition-transform">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
    </svg>
  </button>

  <!-- WhatsApp / Phone / Email group -->
  <div class="flex flex-col gap-2 md:gap-3 p-1.5 md:p-2 backdrop-blur-xl rounded-[1.5rem] md:rounded-[2rem] shadow-2xl bg-white/30 border border-white/50">
    <button (click)="openWhatsApp()" aria-label="Contact on WhatsApp"
      class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl flex items-center justify-center shadow-lg hover:scale-110 transition-transform"
      style="background:#25D366">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.526 5.845L0 24l6.334-1.503A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.885 0-3.652-.49-5.187-1.349l-.371-.22-3.762.893.944-3.663-.242-.378A9.946 9.946 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
      </svg>
    </button>
    <button (click)="openPhone()" aria-label="Call us"
      class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl flex items-center justify-center shadow-lg hover:scale-110 transition-transform"
      style="background:#4C5CCF">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
    </button>
    <button (click)="toggleEnquiry()" aria-label="Open enquiry form"
      class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl flex items-center justify-center shadow-lg hover:scale-110 transition-transform"
      style="background:#0955a0">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </button>
  </div>

  <!-- AI Chat toggle button -->
  <button (click)="toggleChat()" aria-label="Open AI chat assistant"
    class="w-11 h-11 md:w-14 md:h-14 shadow-2xl rounded-xl md:rounded-2xl flex items-center justify-center cursor-pointer relative hover:scale-105 transition-transform"
    style="background:#0f172a">
    <span *ngIf="!openChat"
      class="absolute -top-1 -right-1 w-3 h-3 md:w-4 md:h-4 rounded-full border-2 border-white animate-ping"
      style="background:#3b82f6"></span>
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24">
      <rect x="3" y="8" width="18" height="12" rx="3" stroke="white" stroke-width="1.8" fill="none"/>
      <circle cx="9"  cy="14" r="1.8" fill="white"/>
      <circle cx="15" cy="14" r="1.8" fill="white"/>
      <line x1="12" y1="2" x2="12" y2="6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="8"  y1="6" x2="8"  y2="8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16" y1="6" x2="16" y2="8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="9"  y1="18" x2="15" y2="18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

</div>
