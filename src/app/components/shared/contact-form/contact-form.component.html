<div class="relative w-full">

  <!-- SUCCESS STATE -->
  <div *ngIf="submitted" class="py-16 text-center animate-fade-in">
    <div class="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#22c55e" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 15.182a4.5 4.5 0 01-6.364 0M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z"/>
      </svg>
    </div>
    <h3 class="text-3xl font-black text-slate-900 mb-2">Thank You!</h3>
    <p class="text-slate-500 font-medium">
      {{ isCareerPage ? 'Your application has been received. We will get back to you shortly.' : 'Your request has been received. Your download is starting...' }}
    </p>
  </div>

  <!-- FORM -->
  <form *ngIf="!submitted" (ngSubmit)="onSubmit()" class="space-y-4">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Name -->
      <div class="space-y-1">
        <label class="text-[10px] uppercase tracking-widest font-bold text-slate-400 ml-1">Full Name</label>
        <div class="relative group">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <input required type="text" placeholder="John Doe" [(ngModel)]="name" name="name"
            class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-blue-50 focus:border-blue-400 outline-none text-sm transition-all duration-300 placeholder:text-slate-400 font-medium" />
        </div>
      </div>
      <!-- Email -->
      <div class="space-y-1">
        <label class="text-[10px] uppercase tracking-widest font-bold text-slate-400 ml-1">Email Address</label>
        <div class="relative group">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <input required type="email" placeholder="john@nowara.com" [(ngModel)]="email" name="email"
            class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-blue-50 focus:border-blue-400 outline-none text-sm transition-all duration-300 placeholder:text-slate-400 font-medium" />
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Phone -->
      <div class="space-y-1">
        <label class="text-[10px] uppercase tracking-widest font-bold text-slate-400 ml-1">Phone Number</label>
        <div class="relative group">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          <input required type="tel" placeholder="+91 9XXXXXXXXX" [(ngModel)]="phone" name="phone"
            class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-blue-50 focus:border-blue-400 outline-none text-sm transition-all duration-300 placeholder:text-slate-400 font-medium" />
        </div>
      </div>
      <!-- Subject -->
      <div class="space-y-1">
        <label class="text-[10px] uppercase tracking-widest font-bold text-slate-400 ml-1">Subject</label>
        <div class="relative group">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <input required type="text" [placeholder]="isCareerPage ? 'Applying for...' : 'Service interest'" [(ngModel)]="subject" name="subject"
            class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-blue-50 focus:border-blue-400 outline-none text-sm transition-all duration-300 placeholder:text-slate-400 font-medium h-[52px]" />
        </div>
      </div>
    </div>

    <!-- Resume Upload (career only) -->
    <div *ngIf="isCareerPage" class="space-y-1">
      <label class="text-[10px] uppercase tracking-widest font-bold text-slate-400 ml-1">Attach Resume (PDF, Max 20MB)</label>
      <div class="relative group">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
        <input required type="file" accept=".pdf" (change)="onFileChange($event)"
          class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 text-sm transition-all cursor-pointer file:hidden pt-[14px]" />
        <span *ngIf="resume" class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-green-600 font-bold">✓ Attached</span>
      </div>
    </div>

    <!-- Message -->
    <div class="space-y-1">
      <label class="text-[10px] uppercase tracking-widest font-bold text-slate-400 ml-1">Message (Optional)</label>
      <div class="relative group">
        <svg class="absolute left-4 top-4 text-slate-400 group-focus-within:text-blue-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
        <textarea placeholder="Tell us about your requirements..." rows="3" [(ngModel)]="message" name="message"
          class="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-blue-50 focus:border-blue-400 outline-none text-sm transition-all duration-300 placeholder:text-slate-400 font-medium resize-none min-h-[120px]"></textarea>
      </div>
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="loading"
      class="w-full bg-[#3D77BE] hover:bg-blue-700 text-white font-bold rounded-xl h-14 flex items-center justify-center gap-3 transition-all shadow-lg shadow-blue-100 active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed">
      <ng-container *ngIf="loading">
        <svg class="animate-spin w-5 h-5 border-2 border-white/30 border-t-white rounded-full" viewBox="0 0 24 24"></svg>
        <span>Sending...</span>
      </ng-container>
      <ng-container *ngIf="!loading">
        <span class="tracking-wide">{{ isModal ? 'Download Brochure' : isCareerPage ? 'Submit Application' : 'Send Inquiry' }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </ng-container>
    </button>

  </form>
</div>
